<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XO — أونلاين</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bg: #070710;
  --card: #0f0f1e;
  --border: #1e1e3a;
  --x-color: #ff4d6d;
  --o-color: #4cc9f0;
  --text: #e8e6f0;
  --dim: #4a4868;
  --glow-x: rgba(255,77,109,0.4);
  --glow-o: rgba(76,201,240,0.4);
}
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Cairo', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow-x: hidden;
  position: relative;
}
.bg-orb {
  position: fixed; border-radius: 50%;
  filter: blur(80px); opacity: 0.1;
  animation: float 8s ease-in-out infinite; pointer-events: none;
}
.bg-orb.x { width:400px;height:400px;background:var(--x-color);top:-100px;right:-100px; }
.bg-orb.o { width:350px;height:350px;background:var(--o-color);bottom:-80px;left:-80px;animation-delay:-4s; }
@keyframes float { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(20px,20px) scale(1.05)} }
body::before {
  content:''; position:fixed; inset:0;
  background-image: linear-gradient(var(--border) 1px,transparent 1px), linear-gradient(90deg,var(--border) 1px,transparent 1px);
  background-size: 40px 40px; opacity: 0.2; pointer-events:none;
}

.wrapper {
  position:relative; z-index:1;
  display:flex; flex-direction:column; align-items:center; gap:20px;
  padding:24px 16px; width:100%; max-width:460px;
}

/* Title */
.title { font-family:'Bebas Neue',sans-serif; font-size:64px; letter-spacing:8px; line-height:1; display:flex; gap:4px; }
.title .x { color:var(--x-color); text-shadow:0 0 30px var(--glow-x); }
.title .dash { color:var(--dim); }
.title .o { color:var(--o-color); text-shadow:0 0 30px var(--glow-o); }
.subtitle { font-size:12px; color:var(--dim); letter-spacing:4px; margin-top:-16px; }

/* Screens */
.screen { width:100%; display:flex; flex-direction:column; align-items:center; gap:16px; }
.screen.hidden { display:none; }

/* Card */
.card {
  background:var(--card); border:1px solid var(--border);
  border-radius:20px; padding:24px; width:100%;
  position:relative; overflow:hidden;
}
.card::before {
  content:''; position:absolute; top:0;left:0;right:0; height:2px;
  background:linear-gradient(90deg,transparent,var(--dim),transparent);
}

/* Buttons */
.btn {
  width:100%; background:var(--card); border:1px solid var(--border);
  color:var(--text); padding:16px; border-radius:14px;
  font-family:'Cairo',sans-serif; font-size:15px; font-weight:700;
  cursor:pointer; transition:all 0.2s; letter-spacing:0.5px;
}
.btn:hover { border-color:var(--dim); transform:translateY(-2px); }
.btn.x-btn { border-color:rgba(255,77,109,0.4); background:rgba(255,77,109,0.08); color:var(--x-color); }
.btn.x-btn:hover { border-color:var(--x-color); box-shadow:0 0 20px var(--glow-x); }
.btn.o-btn { border-color:rgba(76,201,240,0.4); background:rgba(76,201,240,0.08); color:var(--o-color); }
.btn.o-btn:hover { border-color:var(--o-color); box-shadow:0 0 20px var(--glow-o); }
.btn.ghost { background:transparent; border-color:var(--border); color:var(--dim); font-size:13px; padding:12px; }
.btn.ghost:hover { color:var(--text); border-color:var(--dim); }
.btn-row { display:flex; gap:10px; width:100%; }
.btn-row .btn { flex:1; }

/* Input */
.inp {
  background:var(--bg); border:1px solid var(--border);
  border-radius:12px; padding:14px; color:var(--text);
  font-family:'Cairo',sans-serif; font-size:14px;
  width:100%; text-align:center; transition:border-color 0.2s;
}
.inp:focus { outline:none; border-color:var(--dim); }

/* Room code display */
.room-code {
  font-family:'Bebas Neue',sans-serif; font-size:52px;
  letter-spacing:12px; text-align:center;
  background:linear-gradient(135deg,var(--x-color),var(--o-color));
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  background-clip:text;
}
.code-label { font-size:12px; color:var(--dim); letter-spacing:3px; text-align:center; }

/* Status */
.status-bar {
  text-align:center; padding:14px; border-radius:12px;
  border:1px solid var(--border); background:var(--card);
  font-size:15px; font-weight:700; width:100%;
  transition:all 0.3s;
}
.status-bar.x { border-color:rgba(255,77,109,0.4); color:var(--x-color); }
.status-bar.o { border-color:rgba(76,201,240,0.4); color:var(--o-color); }
.status-bar.info { color:var(--dim); }

/* Ready buttons */
.ready-section { width:100%; display:flex; flex-direction:column; gap:10px; }
.ready-row { display:flex; gap:10px; width:100%; }
.ready-btn {
  flex:1; padding:18px; border-radius:14px;
  border:2px solid var(--border); background:var(--card);
  color:var(--dim); font-family:'Cairo',sans-serif;
  font-size:14px; font-weight:700; cursor:pointer; transition:all 0.3s;
  display:flex; flex-direction:column; align-items:center; gap:4px;
}
.ready-btn .icon { font-size:28px; }
.ready-btn.x-ready { border-color:rgba(255,77,109,0.3); }
.ready-btn.x-ready:hover { border-color:var(--x-color); color:var(--x-color); box-shadow:0 0 20px var(--glow-x); }
.ready-btn.o-ready { border-color:rgba(76,201,240,0.3); }
.ready-btn.o-ready:hover { border-color:var(--o-color); color:var(--o-color); box-shadow:0 0 20px var(--glow-o); }
.ready-btn.done.x-ready { border-color:var(--x-color); color:var(--x-color); background:rgba(255,77,109,0.1); box-shadow:0 0 20px var(--glow-x); }
.ready-btn.done.o-ready { border-color:var(--o-color); color:var(--o-color); background:rgba(76,201,240,0.1); box-shadow:0 0 20px var(--glow-o); }

/* Scoreboard */
.scoreboard { display:grid; grid-template-columns:1fr auto 1fr; gap:10px; width:100%; align-items:center; }
.score-card {
  background:var(--card); border:1px solid var(--border);
  border-radius:16px; padding:14px 10px; text-align:center; transition:all 0.3s;
}
.score-card.active.x { border-color:var(--x-color); box-shadow:0 0 20px var(--glow-x); }
.score-card.active.o { border-color:var(--o-color); box-shadow:0 0 20px var(--glow-o); }
.s-sym { font-family:'Bebas Neue',sans-serif; font-size:28px; }
.score-card.x .s-sym { color:var(--x-color); }
.score-card.o .s-sym { color:var(--o-color); }
.s-name { font-size:11px; color:var(--dim); margin:2px 0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.s-val { font-size:26px; font-weight:900; }
.score-vs { font-family:'Bebas Neue',sans-serif; font-size:22px; color:var(--dim); text-align:center; }
.score-d { font-size:11px; color:var(--dim); }

/* Board */
#board {
  display:grid; gap:10px; width:100%; max-width:340px;
}
.cell {
  aspect-ratio:1; background:var(--card); border:1px solid var(--border);
  border-radius:18px; display:flex; align-items:center; justify-content:center;
  font-family:'Bebas Neue',sans-serif; font-size:60px;
  cursor:pointer; transition:all 0.2s; user-select:none;
}
.cell:hover:not(.taken) { border-color:var(--dim); transform:scale(1.04); }
.cell.x-cell { color:var(--x-color); border-color:rgba(255,77,109,0.3); text-shadow:0 0 20px var(--glow-x); animation:popIn 0.25s cubic-bezier(0.175,0.885,0.32,1.275); }
.cell.o-cell { color:var(--o-color); border-color:rgba(76,201,240,0.3); text-shadow:0 0 20px var(--glow-o); animation:popIn 0.25s cubic-bezier(0.175,0.885,0.32,1.275); }
.cell.win-cell.x-cell { background:rgba(255,77,109,0.12); border-color:var(--x-color); box-shadow:0 0 25px var(--glow-x); }
.cell.win-cell.o-cell { background:rgba(76,201,240,0.12); border-color:var(--o-color); box-shadow:0 0 25px var(--glow-o); }
@keyframes popIn { 0%{transform:scale(0.4);opacity:0} 100%{transform:scale(1);opacity:1} }

/* Modal */
.modal-overlay {
  position:fixed; inset:0; background:rgba(0,0,0,0.85);
  display:flex; align-items:center; justify-content:center;
  z-index:100; backdrop-filter:blur(8px);
  opacity:0; pointer-events:none; transition:opacity 0.3s;
}
.modal-overlay.show { opacity:1; pointer-events:all; }
.modal {
  background:var(--card); border:1px solid var(--border);
  border-radius:24px; padding:32px; text-align:center;
  max-width:320px; width:90%;
  transform:scale(0.85); transition:all 0.3s cubic-bezier(0.175,0.885,0.32,1.275);
}
.modal-overlay.show .modal { transform:scale(1); }
.m-icon { font-size:60px; margin-bottom:8px; }
.m-title { font-family:'Bebas Neue',sans-serif; font-size:34px; margin-bottom:6px; }
.m-title.x { color:var(--x-color); text-shadow:0 0 20px var(--glow-x); }
.m-title.o { color:var(--o-color); text-shadow:0 0 20px var(--glow-o); }
.m-title.draw { color:var(--dim); }
.m-sub { color:var(--dim); font-size:13px; margin-bottom:20px; }

/* Confetti */
.confetti-piece {
  position:fixed; pointer-events:none; z-index:200;
  animation:confettiFall 1.8s ease-out forwards;
}
@keyframes confettiFall {
  0%{transform:translateY(-20px) rotate(0deg);opacity:1}
  100%{transform:translateY(100vh) rotate(720deg);opacity:0}
}

/* Ping dot */
.ping { display:inline-block; width:8px;height:8px;border-radius:50%; background:#22c55e; margin-left:6px; animation:ping 1.5s infinite; }
@keyframes ping { 0%,100%{opacity:1} 50%{opacity:0.3} }
</style>
</head>
<body>
<div class="bg-orb x"></div>
<div class="bg-orb o"></div>

<div class="wrapper">
  <div>
    <div class="title"><span class="x">X</span><span class="dash">—</span><span class="o">O</span></div>
    <div class="subtitle">العب أونلاين مع أصدقائك</div>
  </div>

  <!-- SCREEN 1: Home -->
  <div class="screen" id="screen-home">
    <div class="card">
      <div style="font-size:13px;color:var(--dim);margin-bottom:16px;text-align:center;letter-spacing:2px;">وش تبي؟</div>
      <div style="display:flex;flex-direction:column;gap:10px;">
        <button class="btn x-btn" onclick="showCreate()">✚ إنشاء غرفة جديدة</button>
        <button class="btn o-btn" onclick="showJoin()">🔗 انضم لغرفة</button>
      </div>
    </div>
    <div id="join-section" class="card hidden">
      <div style="font-size:13px;color:var(--dim);margin-bottom:12px;text-align:center;">أدخل كود الغرفة</div>
      <input class="inp" id="join-code" placeholder="مثال: 1234" maxlength="6" style="margin-bottom:12px;font-size:24px;letter-spacing:8px;font-family:'Bebas Neue',sans-serif;">
      <input class="inp" id="join-name" placeholder="اسمك" style="margin-bottom:12px;">
      <button class="btn o-btn" onclick="joinRoom()">انضم ←</button>
      <button class="btn ghost" onclick="hideJoin()" style="margin-top:8px;">إلغاء</button>
    </div>
    <div id="create-section" class="card hidden">
      <div style="font-size:13px;color:var(--dim);margin-bottom:12px;text-align:center;">اسمك</div>
      <input class="inp" id="create-name" placeholder="اسمك" style="margin-bottom:12px;">
      <button class="btn x-btn" onclick="createRoom()">إنشاء الغرفة ✚</button>
      <button class="btn ghost" onclick="hideCreate()" style="margin-top:8px;">إلغاء</button>
    </div>
  </div>

  <!-- SCREEN 2: Waiting -->
  <div class="screen hidden" id="screen-waiting">
    <div class="card" style="text-align:center;">
      <div class="code-label">كود الغرفة — شاركه مع صديقك</div>
      <div class="room-code" id="display-code">----</div>
      <button class="btn ghost" onclick="copyCode()" style="margin-top:12px;">📋 نسخ الكود</button>
    </div>
    <div class="status-bar info">⏳ في انتظار صديقك...</div>
  </div>

  <!-- SCREEN 3: Ready -->
  <div class="screen hidden" id="screen-ready">
    <div class="status-bar info" id="ready-status">الاثنين لازم يضغطون جاهز!</div>
    <div class="ready-section">
      <div class="ready-row">
        <button class="ready-btn x-ready" id="btn-ready-x" onclick="setReady('X')">
          <span class="icon">✖</span>
          <span id="ready-name-x">لاعب X</span>
          <span id="ready-check-x" style="font-size:11px;color:var(--dim);">لم يضغط بعد</span>
        </button>
        <button class="ready-btn o-ready" id="btn-ready-o" onclick="setReady('O')">
          <span class="icon">○</span>
          <span id="ready-name-o">لاعب O</span>
          <span id="ready-check-o" style="font-size:11px;color:var(--dim);">لم يضغط بعد</span>
        </button>
      </div>
    </div>
    <div class="status-bar info" style="font-size:12px;">
      الغرفة: <span id="ready-code" style="font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:4px;"></span>
      <span class="ping"></span>
    </div>
  </div>

  <!-- SCREEN 4: Game -->
  <div class="screen hidden" id="screen-game">
    <div class="scoreboard">
      <div class="score-card x" id="sc-x">
        <div class="s-sym">X</div>
        <div class="s-name" id="sn-x">لاعب X</div>
        <div class="s-val" id="sv-x">0</div>
      </div>
      <div style="text-align:center;">
        <div class="score-vs">VS</div>
        <div class="score-d">تعادل: <span id="sv-d">0</span></div>
      </div>
      <div class="score-card o" id="sc-o">
        <div class="s-sym">O</div>
        <div class="s-name" id="sn-o">لاعب O</div>
        <div class="s-val" id="sv-o">0</div>
      </div>
    </div>
    <div class="status-bar" id="game-status">دور X</div>
    <div id="board" style="grid-template-columns:repeat(3,1fr);"></div>
    <div class="btn-row">
      <button class="btn" style="font-size:13px;" onclick="requestRematch()">🔄 جولة أخرى</button>
      <button class="btn ghost" style="flex:0.5;" onclick="leaveGame()">🚪</button>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="m-icon" id="m-icon"></div>
    <div class="m-title" id="m-title"></div>
    <div class="m-sub" id="m-sub"></div>
    <div class="btn-row" style="justify-content:center;">
      <button class="btn" onclick="requestRematch();closeModal()">🔄 جولة أخرى</button>
      <button class="btn ghost" onclick="closeModal()">إغلاق</button>
    </div>
  </div>
</div>

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, get, update, onValue, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCz1Y8NnQXA3AHzJkdwlKefOIDNDrLlk-s",
  authDomain: "xo-made-by-kitawore.firebaseapp.com",
  databaseURL: "https://xo-made-by-kitawore-default-rtdb.firebaseio.com",
  projectId: "xo-made-by-kitawore",
  storageBucket: "xo-made-by-kitawore.firebasestorage.app",
  messagingSenderId: "515998245812",
  appId: "1:515998245812:web:5cbe3eb4d43ca01ef448e1",
  measurementId: "G-J50J1J9FW8"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// State
let roomCode = '';
let mySymbol = '';
let myName = '';
let roomRef = null;
let unsubscribe = null;
let scores = { X:0, O:0, D:0 };
let gameOver = false;

// ---- Helpers ----
function genCode() {
  return Math.floor(1000 + Math.random() * 9000).toString();
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}

// ---- Home ----
window.showCreate = () => {
  document.getElementById('create-section').classList.remove('hidden');
  document.getElementById('join-section').classList.add('hidden');
};
window.hideCreate = () => document.getElementById('create-section').classList.add('hidden');
window.showJoin = () => {
  document.getElementById('join-section').classList.remove('hidden');
  document.getElementById('create-section').classList.add('hidden');
};
window.hideJoin = () => document.getElementById('join-section').classList.add('hidden');

// ---- Create Room ----
window.createRoom = async () => {
  const name = document.getElementById('create-name').value.trim() || 'لاعب X';
  roomCode = genCode();
  mySymbol = 'X';
  myName = name;
  roomRef = ref(db, 'rooms/' + roomCode);

  await set(roomRef, {
    players: { X: { name, ready: false }, O: null },
    board: Array(9).fill(null),
    turn: 'X',
    status: 'waiting',
    scores: { X:0, O:0, D:0 }
  });

  document.getElementById('display-code').textContent = roomCode;
  showScreen('screen-waiting');
  listenRoom();
};

// ---- Join Room ----
window.joinRoom = async () => {
  const code = document.getElementById('join-code').value.trim();
  const name = document.getElementById('join-name').value.trim() || 'لاعب O';
  if(!code) return;

  roomRef = ref(db, 'rooms/' + code);
  const snap = await get(roomRef);
  if(!snap.exists()) { alert('الغرفة مو موجودة!'); return; }

  const data = snap.val();
  if(data.players.O) { alert('الغرفة ممتلئة!'); return; }

  roomCode = code;
  mySymbol = 'O';
  myName = name;

  await update(ref(db, 'rooms/' + code + '/players'), {
    O: { name, ready: false }
  });
  await update(roomRef, { status: 'ready' });

  showScreen('screen-ready');
  listenRoom();
};

// ---- Listen ----
function listenRoom() {
  if(unsubscribe) unsubscribe();
  unsubscribe = onValue(roomRef, (snap) => {
    if(!snap.exists()) { leaveGame(); return; }
    const data = snap.val();
    handleRoomUpdate(data);
  });
}

function handleRoomUpdate(data) {
  const status = data.status;

  if(status === 'waiting') {
    showScreen('screen-waiting');
  }

  if(status === 'ready') {
    showScreen('screen-ready');
    const px = data.players?.X;
    const po = data.players?.O;
    document.getElementById('ready-name-x').textContent = px?.name || 'لاعب X';
    document.getElementById('ready-name-o').textContent = po?.name || 'لاعب O';
    document.getElementById('ready-code').textContent = roomCode;

    const xReady = px?.ready;
    const oReady = po?.ready;

    const btnX = document.getElementById('btn-ready-x');
    const btnO = document.getElementById('btn-ready-o');
    btnX.classList.toggle('done', !!xReady);
    btnO.classList.toggle('done', !!oReady);
    document.getElementById('ready-check-x').textContent = xReady ? '✅ جاهز!' : 'لم يضغط بعد';
    document.getElementById('ready-check-o').textContent = oReady ? '✅ جاهز!' : 'لم يضغط بعد';

    if(xReady && oReady) {
      // Start game
      update(roomRef, { status: 'playing', board: Array(9).fill(null), turn: 'X' });
    }
  }

  if(status === 'playing') {
    showScreen('screen-game');
    renderGameState(data);
  }

  if(status === 'rematch') {
    update(roomRef, {
      status: 'ready',
      'players/X/ready': false,
      'players/O/ready': false,
      board: Array(9).fill(null),
      turn: 'X'
    });
  }
}

function renderGameState(data) {
  // Firebase may return board as object {0:val, 1:val...} - convert to array
  let board = data.board || Array(9).fill(null);
  if(!Array.isArray(board)) {
    const arr = Array(9).fill(null);
    Object.keys(board).forEach(k => { arr[parseInt(k)] = board[k]; });
    board = arr;
  }
  const turn = data.turn || 'X';
  const px = data.players?.X;
  const po = data.players?.O;
  const sc = data.scores || { X:0, O:0, D:0 };

  // Names
  document.getElementById('sn-x').textContent = px?.name || 'لاعب X';
  document.getElementById('sn-o').textContent = po?.name || 'لاعب O';
  document.getElementById('sv-x').textContent = sc.X || 0;
  document.getElementById('sv-o').textContent = sc.O || 0;
  document.getElementById('sv-d').textContent = sc.D || 0;

  // Active card
  document.getElementById('sc-x').classList.toggle('active', turn === 'X');
  document.getElementById('sc-o').classList.toggle('active', turn === 'O');

  // Status
  const statusEl = document.getElementById('game-status');
  const isMyTurn = turn === mySymbol;
  if(data.winner) {
    gameOver = true;
    const winnerName = data.winner === 'X' ? px?.name : po?.name;
    statusEl.textContent = `🏆 فاز ${winnerName}!`;
    statusEl.className = 'status-bar ' + data.winner.toLowerCase();
  } else if(data.draw) {
    gameOver = true;
    statusEl.textContent = '🤝 تعادل!';
    statusEl.className = 'status-bar info';
  } else {
    gameOver = false;
    statusEl.textContent = isMyTurn ? `دورك أنت! (${mySymbol})` : `دور ${turn === 'X' ? px?.name : po?.name}`;
    statusEl.className = 'status-bar ' + turn.toLowerCase();
  }

  // Board
  const boardEl = document.getElementById('board');
  boardEl.innerHTML = '';
  for(let i = 0; i < 9; i++) {
    const val = board[i] || null;
    const cell = document.createElement('div');
    cell.className = 'cell' + (val ? ' taken ' + (val==='X'?'x-cell':'o-cell') : '');
    if(data.winLine) {
      const wl = Array.isArray(data.winLine) ? data.winLine : Object.values(data.winLine);
      if(wl.includes(i)) cell.classList.add('win-cell');
    }
    cell.textContent = val || '';
    cell.onclick = () => handleCellClick(i, board, turn);
    boardEl.appendChild(cell);
  }

  // Show modal on end
  if(data.winner && !document.getElementById('modal').classList.contains('shown')) {
    const winnerName = data.winner === 'X' ? px?.name : po?.name;
    setTimeout(() => {
      showConfetti(data.winner);
      showModal(data.winner === mySymbol ? '🏆' : '😔',
        winnerName + ' فاز!',
        data.winner.toLowerCase(),
        data.winner === mySymbol ? 'أحسنت! 🎉' : 'حظاً أوفر المرة القادمة!');
    }, 600);
    document.getElementById('modal').classList.add('shown');
  }
  if(data.draw && !document.getElementById('modal').classList.contains('shown')) {
    setTimeout(() => {
      showModal('🤝', 'تعادل!', 'draw', 'لا فائز هذه المرة!');
    }, 400);
    document.getElementById('modal').classList.add('shown');
  }
  if(!data.winner && !data.draw) {
    document.getElementById('modal').classList.remove('shown');
  }
}

function handleCellClick(i, boardRaw, turn) {
  // Normalize board
  let board = boardRaw;
  if(!Array.isArray(board)) {
    const arr = Array(9).fill(null);
    Object.keys(board).forEach(k => { arr[parseInt(k)] = board[k]; });
    board = arr;
  }
  if(gameOver || board[i] || turn !== mySymbol) return;
  const newBoard = [...board];
  newBoard[i] = mySymbol;

  const result = checkWin(newBoard);
  const updates = { board: newBoard, turn: mySymbol === 'X' ? 'O' : 'X' };

  if(result) {
    if(result.winner) {
      updates.winner = result.winner;
      updates.winLine = result.line;
      updates.turn = result.winner;
      const newScores = { ...(result.scores || {X:0,O:0,D:0}) };
      // get current scores from Firebase then increment
      get(ref(db, 'rooms/' + roomCode + '/scores')).then(snap => {
        const cur = snap.val() || {X:0,O:0,D:0};
        cur[result.winner] = (cur[result.winner]||0) + 1;
        updates.scores = cur;
        update(roomRef, updates);
      });
      return;
    }
    if(result.draw) {
      updates.draw = true;
      get(ref(db, 'rooms/' + roomCode + '/scores')).then(snap => {
        const cur = snap.val() || {X:0,O:0,D:0};
        cur.D = (cur.D||0) + 1;
        updates.scores = cur;
        update(roomRef, updates);
      });
      return;
    }
  }
  update(roomRef, updates);
}

function checkWin(board) {
  const lines = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];
  for(const line of lines) {
    const [a,b,c] = line;
    if(board[a] && board[a]===board[b] && board[a]===board[c])
      return { winner: board[a], line };
  }
  if(board.every(v=>v)) return { draw: true };
  return null;
}

// ---- Ready ----
window.setReady = async (symbol) => {
  if(symbol !== mySymbol) return;
  await update(ref(db, `rooms/${roomCode}/players/${symbol}`), { ready: true });
};

// ---- Rematch ----
window.requestRematch = async () => {
  if(!roomRef) return;
  closeModal();
  await update(roomRef, { status: 'rematch', winner: null, draw: null, winLine: null });
};

// ---- Leave ----
window.leaveGame = async () => {
  if(unsubscribe) unsubscribe();
  if(roomRef && mySymbol === 'X') await remove(roomRef);
  roomRef = null; roomCode = ''; mySymbol = ''; myName = '';
  showScreen('screen-home');
};

// ---- Copy Code ----
window.copyCode = () => {
  navigator.clipboard.writeText(roomCode).then(() => {
    const btn = document.querySelector('#screen-waiting .btn.ghost');
    const orig = btn.textContent;
    btn.textContent = '✅ تم النسخ!';
    setTimeout(() => btn.textContent = orig, 2000);
  });
};

// ---- Modal ----
window.showModal = (icon, title, cls, sub) => {
  document.getElementById('m-icon').textContent = icon;
  document.getElementById('m-title').textContent = title;
  document.getElementById('m-title').className = 'm-title ' + (cls||'');
  document.getElementById('m-sub').textContent = sub;
  document.getElementById('modal').classList.add('show');
};
window.closeModal = () => document.getElementById('modal').classList.remove('show');

// ---- Confetti ----
function showConfetti(winner) {
  const colors = winner === 'X'
    ? ['#ff4d6d','#ff8fa3','#ffb3c1']
    : ['#4cc9f0','#90e0ef','#caf0f8'];
  for(let i=0;i<40;i++) {
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    p.style.cssText = `
      left:${Math.random()*100}vw; top:0;
      background:${colors[Math.floor(Math.random()*colors.length)]};
      width:${6+Math.random()*8}px; height:${6+Math.random()*8}px;
      animation-duration:${1.2+Math.random()*1.5}s;
      animation-delay:${Math.random()*0.4}s;
      border-radius:${Math.random()>0.5?'50%':'2px'};
    `;
    document.body.appendChild(p);
    setTimeout(()=>p.remove(), 3000);
  }
}
</script>
