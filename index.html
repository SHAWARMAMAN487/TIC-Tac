<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎮 لعب لعب!</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #FF3B3B;
    --blue: #3B8BFF;
    --gold: #FFD700;
    --gem: #A855F7;
    --bg: #1a0533;
    --card-bg: #2a1045;
    --text: #fff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    font-family: 'Tajawal', sans-serif;
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    background-image:
      radial-gradient(ellipse at 20% 20%, #3b0a6a44 0%, transparent 60%),
      radial-gradient(ellipse at 80% 80%, #0a2a6a44 0%, transparent 60%);
  }

  /* Stars background */
  body::before {
    content: '⭐✨🌟💫⭐✨🌟💫⭐✨🌟💫⭐✨🌟💫⭐✨🌟💫⭐✨🌟💫⭐✨🌟💫⭐✨';
    position: fixed;
    top: 0; left: 0; right: 0;
    font-size: 20px;
    opacity: 0.07;
    word-break: break-all;
    line-height: 2;
    pointer-events: none;
    z-index: 0;
  }

  /* ===== TOP BAR ===== */
  .topbar {
    position: relative;
    z-index: 10;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 24px;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);
    border-bottom: 2px solid rgba(255,255,255,0.1);
  }

  .topbar-right {
    display: flex;
    gap: 12px;
  }

  .currency-badge {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(255,255,255,0.1);
    border-radius: 50px;
    padding: 8px 16px;
    font-family: 'Fredoka One', cursive;
    font-size: 18px;
    border: 2px solid rgba(255,255,255,0.15);
    transition: transform 0.2s;
  }
  .currency-badge:hover { transform: scale(1.05); }

  .coin-badge { color: var(--gold); border-color: #FFD70044; }
  .coin-badge .icon { font-size: 22px; }

  .gem-badge { color: #d88aff; border-color: #A855F744; }
  .gem-badge .icon { font-size: 22px; }

  .topbar-title {
    font-family: 'Fredoka One', cursive;
    font-size: 28px;
    background: linear-gradient(135deg, #ff6b6b, #ffd700, #6bf5ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-align: center;
  }

  .topbar-left {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .side-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(255,255,255,0.08);
    border: 2px solid rgba(255,255,255,0.15);
    border-radius: 14px;
    padding: 8px 14px;
    color: white;
    font-family: 'Tajawal', sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    width: 130px;
  }
  .side-btn:hover { background: rgba(255,255,255,0.15); transform: scale(1.05); }
  .side-btn .icon { font-size: 20px; }

  .coming-soon-tag {
    position: absolute;
    top: -8px;
    left: -8px;
    background: #ff9800;
    color: #000;
    font-size: 9px;
    font-weight: 900;
    padding: 2px 6px;
    border-radius: 20px;
    white-space: nowrap;
    animation: pulse 1.5s infinite;
  }

  @keyframes pulse {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.1); }
  }

  /* ===== MAIN SCREEN ===== */
  .screen { display: none; }
  .screen.active { display: block; }

  /* ===== MODE SELECT ===== */
  #screen-mode {
    position: relative;
    z-index: 5;
    min-height: calc(100vh - 90px);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 32px;
    padding: 40px 20px;
  }
  #screen-mode.active { display: flex; }

  .mode-title {
    font-family: 'Fredoka One', cursive;
    font-size: 42px;
    text-align: center;
    background: linear-gradient(135deg, #ff6b6b, #ffd700);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: float 3s ease-in-out infinite;
  }

  @keyframes float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  .mode-btns {
    display: flex;
    gap: 32px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .mode-btn {
    width: 200px;
    height: 200px;
    border-radius: 30px;
    border: none;
    cursor: pointer;
    font-family: 'Fredoka One', cursive;
    font-size: 26px;
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    transition: all 0.3s;
    position: relative;
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  }

  .mode-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,0.15);
    opacity: 0;
    transition: opacity 0.3s;
  }
  .mode-btn:hover::before { opacity: 1; }
  .mode-btn:hover { transform: translateY(-8px) scale(1.05); }
  .mode-btn:active { transform: scale(0.97); }

  .mode-btn .emoji { font-size: 60px; }
  .mode-btn .desc { font-size: 13px; opacity: 0.9; text-align: center; padding: 0 10px; font-family: 'Tajawal', sans-serif; font-weight: 700; }

  .btn-2p { background: linear-gradient(135deg, #1a6fff, #0a3fa0); border: 3px solid #5aaaff; }
  .btn-1p { background: linear-gradient(135deg, #ff3b3b, #a00a0a); border: 3px solid #ff8a8a; }

  /* ===== GAME SELECT ===== */
  #screen-games {
    position: relative;
    z-index: 5;
    min-height: calc(100vh - 90px);
    display: none;
    flex-direction: column;
    align-items: center;
    padding: 30px 20px;
    gap: 24px;
  }
  #screen-games.active { display: flex; }

  .games-header {
    display: flex;
    align-items: center;
    gap: 16px;
    width: 100%;
    max-width: 900px;
  }

  .back-btn {
    background: rgba(255,255,255,0.1);
    border: 2px solid rgba(255,255,255,0.2);
    border-radius: 14px;
    color: white;
    font-size: 22px;
    width: 46px;
    height: 46px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;align-items:center;justify-content:center;
  }
  .back-btn:hover { background: rgba(255,255,255,0.2); transform: scale(1.1); }

  .games-title {
    font-family: 'Fredoka One', cursive;
    font-size: 28px;
    flex: 1;
  }

  .mode-indicator {
    padding: 6px 16px;
    border-radius: 20px;
    font-weight: 900;
    font-size: 14px;
  }
  .mode-indicator.two { background: var(--blue); }
  .mode-indicator.one { background: var(--red); }

  .games-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 16px;
    width: 100%;
    max-width: 900px;
  }

  .game-card {
    background: var(--card-bg);
    border-radius: 20px;
    padding: 20px 12px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s;
    border: 3px solid transparent;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }

  .game-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 12px 30px rgba(0,0,0,0.4);
  }

  .game-card.red { border-color: #ff3b3b55; }
  .game-card.red:hover { border-color: var(--red); background: #3a0a0a; }
  .game-card.blue { border-color: #3b8bff55; }
  .game-card.blue:hover { border-color: var(--blue); background: #0a1a3a; }

  .game-card .g-emoji { font-size: 50px; }
  .game-card .g-name {
    font-family: 'Fredoka One', cursive;
    font-size: 16px;
    line-height: 1.3;
  }
  .game-card.red .g-name { color: #ff8a8a; }
  .game-card.blue .g-name { color: #8abfff; }

  .game-card .g-desc {
    font-size: 11px;
    opacity: 0.7;
    font-weight: 700;
  }

  /* ===== GAME AREA ===== */
  #screen-game {
    position: relative;
    z-index: 5;
    min-height: calc(100vh - 90px);
    display: none;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    gap: 16px;
  }
  #screen-game.active { display: flex; }

  .game-top-bar {
    display: flex;
    align-items: center;
    gap: 16px;
    width: 100%;
    max-width: 800px;
  }

  .game-title-bar {
    font-family: 'Fredoka One', cursive;
    font-size: 24px;
    flex: 1;
    text-align: center;
  }

  .game-container {
    width: 100%;
    max-width: 800px;
    background: var(--card-bg);
    border-radius: 24px;
    padding: 24px;
    border: 3px solid rgba(255,255,255,0.1);
    min-height: 400px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  /* ===== PLAYER LABELS ===== */
  .players-bar {
    display: flex;
    justify-content: space-between;
    width: 100%;
    max-width: 800px;
  }

  .player-label {
    padding: 8px 20px;
    border-radius: 20px;
    font-family: 'Fredoka One', cursive;
    font-size: 18px;
  }
  .player-label.p1 { background: linear-gradient(135deg,#ff3b3b,#a00); }
  .player-label.p2 { background: linear-gradient(135deg,#1a6fff,#0a3fa0); }
  .player-label.ai { background: linear-gradient(135deg,#555,#222); }

  .turn-indicator {
    text-align: center;
    font-family: 'Fredoka One', cursive;
    font-size: 20px;
    padding: 8px 24px;
    border-radius: 20px;
    background: rgba(255,255,255,0.1);
  }

  /* ===== WIN POPUP ===== */
  .win-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    z-index: 100;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(6px);
  }
  .win-overlay.show { display: flex; }

  .win-box {
    background: var(--card-bg);
    border-radius: 30px;
    padding: 40px;
    text-align: center;
    border: 3px solid rgba(255,255,255,0.2);
    animation: popIn 0.4s cubic-bezier(0.34,1.56,0.64,1);
    max-width: 360px;
    width: 90%;
  }

  @keyframes popIn {
    from { transform: scale(0.5); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .win-emoji { font-size: 80px; }
  .win-text { font-family: 'Fredoka One', cursive; font-size: 36px; margin: 10px 0; }
  .win-sub { opacity: 0.7; margin-bottom: 20px; }

  .win-btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

  .win-btn {
    padding: 12px 24px;
    border-radius: 16px;
    border: none;
    font-family: 'Fredoka One', cursive;
    font-size: 18px;
    cursor: pointer;
    transition: all 0.2s;
    color: white;
  }
  .win-btn:hover { transform: scale(1.07); }
  .win-btn.again { background: linear-gradient(135deg,#22c55e,#16a34a); }
  .win-btn.menu { background: linear-gradient(135deg,#6366f1,#4338ca); }

  /* ===== GAMES CSS ===== */

  /* TIC TAC TOE */
  .ttt-board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    width: 300px;
  }
  .ttt-cell {
    width: 90px; height: 90px;
    background: rgba(255,255,255,0.07);
    border-radius: 16px;
    border: 3px solid rgba(255,255,255,0.15);
    font-size: 42px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Fredoka One', cursive;
  }
  .ttt-cell:hover:not(.taken) { background: rgba(255,255,255,0.15); transform: scale(1.05); }
  .ttt-cell.taken { cursor: default; }
  .ttt-cell.x { color: var(--red); border-color: var(--red); }
  .ttt-cell.o { color: var(--blue); border-color: var(--blue); }
  .ttt-cell.win-cell { animation: winCell 0.4s ease forwards; }
  @keyframes winCell { to { background: rgba(255,215,0,0.3); border-color: gold; transform: scale(1.1); } }

  /* ROCK PAPER SCISSORS */
  .rps-choices { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
  .rps-btn {
    width: 100px; height: 100px;
    border-radius: 20px;
    background: rgba(255,255,255,0.08);
    border: 3px solid rgba(255,255,255,0.2);
    font-size: 50px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;align-items:center;justify-content:center;
  }
  .rps-btn:hover { background: rgba(255,255,255,0.18); transform: scale(1.1); }
  .rps-result { font-family:'Fredoka One',cursive; font-size:22px; text-align:center; min-height:40px; }
  .rps-scores { display:flex; gap:40px; justify-content:center; }
  .rps-score { text-align:center; }
  .rps-score .num { font-family:'Fredoka One',cursive; font-size:48px; }
  .rps-score .lbl { font-size:13px; opacity:0.7; }
  .rps-display { display:flex; gap:40px; align-items:center; font-size:60px; min-height:80px; justify-content:center; }
  .rps-vs { font-family:'Fredoka One',cursive; font-size:24px; opacity:0.6; }

  /* MEMORY */
  .mem-board {
    display: grid;
    gap: 10px;
  }
  .mem-card {
    aspect-ratio: 1;
    border-radius: 14px;
    background: rgba(255,255,255,0.1);
    border: 2px solid rgba(255,255,255,0.2);
    font-size: 32px;
    cursor: pointer;
    transition: all 0.3s;
    display:flex;align-items:center;justify-content:center;
    user-select: none;
  }
  .mem-card:hover:not(.flipped):not(.matched) { background: rgba(255,255,255,0.2); }
  .mem-card.flipped { background: rgba(255,255,255,0.15); border-color: gold; }
  .mem-card.matched { background: rgba(34,197,94,0.2); border-color: #22c55e; cursor:default; }
  .mem-scores { display:flex;gap:40px;justify-content:center; }
  .mem-score { text-align:center; }
  .mem-score .num { font-family:'Fredoka One',cursive; font-size:40px; }

  /* SNAKE LADDER (simplified dice game) */
  .snl-board { display:grid; grid-template-columns:repeat(5,1fr); gap:4px; }
  .snl-cell {
    width:54px;height:54px;
    border-radius:10px;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.1);
    display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:700;position:relative;
    flex-direction:column;
  }
  .snl-cell.special { font-size:20px; }
  .snl-dice-btn {
    padding:14px 36px;
    border-radius:18px;
    background:linear-gradient(135deg,#f59e0b,#d97706);
    border:none;color:white;
    font-family:'Fredoka One',cursive;font-size:22px;
    cursor:pointer;transition:all 0.2s;
  }
  .snl-dice-btn:hover { transform:scale(1.05); }
  .snl-dice-btn:disabled { opacity:0.5;cursor:default;transform:none; }
  .snl-info { font-family:'Fredoka One',cursive;font-size:18px;text-align:center;min-height:30px; }
  .pawn { position:absolute;width:20px;height:20px;border-radius:50%;top:2px; }
  .pawn.p1 { background:var(--red);right:4px; }
  .pawn.p2 { background:var(--blue);left:4px; }

  /* GUESS NUMBER */
  .guess-input {
    background:rgba(255,255,255,0.1);
    border:3px solid rgba(255,255,255,0.2);
    border-radius:16px;
    color:white;
    font-family:'Fredoka One',cursive;
    font-size:28px;
    width:150px;
    text-align:center;
    padding:10px;
    outline:none;
  }
  .guess-input:focus { border-color:var(--gold); }
  .guess-btn {
    padding:12px 32px;border-radius:16px;border:none;
    background:linear-gradient(135deg,#22c55e,#16a34a);
    color:white;font-family:'Fredoka One',cursive;font-size:22px;
    cursor:pointer;transition:all 0.2s;
  }
  .guess-btn:hover { transform:scale(1.05); }
  .guess-hints { text-align:center;min-height:80px;display:flex;flex-direction:column;gap:6px;align-items:center; }
  .guess-hint { padding:4px 16px;border-radius:20px;background:rgba(255,255,255,0.1);font-size:15px; }
  .guess-scores { display:flex;gap:40px;justify-content:center; }
  .guess-score { text-align:center; }
  .guess-score .num { font-family:'Fredoka One',cursive;font-size:40px; }

  /* SPIN WHEEL */
  .wheel-wrap { position:relative;display:flex;align-items:center;justify-content:center; }
  canvas#wheel { border-radius:50%;box-shadow:0 0 30px rgba(0,0,0,0.5); }
  .wheel-arrow {
    position:absolute;top:-18px;
    font-size:36px;
    filter:drop-shadow(0 0 6px gold);
  }
  .spin-btn {
    padding:14px 36px;border-radius:18px;border:none;
    background:linear-gradient(135deg,#ec4899,#be185d);
    color:white;font-family:'Fredoka One',cursive;font-size:22px;
    cursor:pointer;transition:all 0.2s;
  }
  .spin-btn:hover:not(:disabled) { transform:scale(1.05); }
  .spin-btn:disabled { opacity:0.5;cursor:default; }
  .spin-result { font-family:'Fredoka One',cursive;font-size:22px;min-height:36px;text-align:center; }
  .spin-scores { display:flex;gap:40px;justify-content:center; }
  .spin-score .num { font-family:'Fredoka One',cursive;font-size:40px; }
  .spin-score { text-align:center; }

  /* REACTION */
  .reaction-area {
    width:280px;height:280px;border-radius:30px;
    display:flex;align-items:center;justify-content:center;
    font-family:'Fredoka One',cursive;font-size:28px;
    cursor:pointer;transition:all 0.2s;
    user-select:none;
    border:4px solid rgba(255,255,255,0.1);
  }
  .reaction-area.waiting { background:#222; }
  .reaction-area.ready { background:linear-gradient(135deg,#22c55e,#16a34a); animation:readyPulse 0.3s; }
  @keyframes readyPulse { from{transform:scale(0.95)} to{transform:scale(1)} }
  .reaction-area.too-early { background:linear-gradient(135deg,var(--red),#a00); }
  .reaction-scores { display:flex;gap:40px;justify-content:center; }
  .reaction-score { text-align:center; }
  .reaction-score .num { font-family:'Fredoka One',cursive;font-size:36px; }
  .reaction-info { font-family:'Fredoka One',cursive;font-size:18px;text-align:center;min-height:36px; }
  .next-round-btn {
    padding:10px 28px;border-radius:14px;border:none;
    background:linear-gradient(135deg,#6366f1,#4338ca);
    color:white;font-family:'Fredoka One',cursive;font-size:18px;
    cursor:pointer;transition:all 0.2s;display:none;
  }
  .next-round-btn:hover { transform:scale(1.05); }

  /* COLOR MATCH */
  .color-display {
    width:200px;height:120px;border-radius:20px;
    display:flex;align-items:center;justify-content:center;
    font-family:'Fredoka One',cursive;font-size:24px;color:white;
    text-shadow:0 2px 4px rgba(0,0,0,0.5);
    border:4px solid rgba(255,255,255,0.3);
  }
  .color-choices { display:flex;gap:12px;flex-wrap:wrap;justify-content:center; }
  .color-choice {
    width:70px;height:70px;border-radius:16px;
    border:3px solid rgba(255,255,255,0.3);
    cursor:pointer;transition:all 0.2s;
  }
  .color-choice:hover { transform:scale(1.1);border-color:white; }
  .color-scores { display:flex;gap:40px;justify-content:center; }
  .color-score { text-align:center; }
  .color-score .num { font-family:'Fredoka One',cursive;font-size:40px; }
  .color-question { font-family:'Fredoka One',cursive;font-size:20px;text-align:center; }
  .color-feedback { font-family:'Fredoka One',cursive;font-size:22px;text-align:center;min-height:36px; }

  /* WORD SCRAMBLE */
  .scramble-word {
    font-family:'Fredoka One',cursive;font-size:42px;
    letter-spacing:8px;color:var(--gold);
    text-align:center;
  }
  .scramble-hint { font-size:14px;opacity:0.6;text-align:center; }
  .scramble-input {
    background:rgba(255,255,255,0.1);border:3px solid rgba(255,255,255,0.2);
    border-radius:16px;color:white;
    font-family:'Fredoka One',cursive;font-size:24px;
    width:220px;text-align:center;padding:10px;outline:none;
    text-transform:uppercase;
  }
  .scramble-input:focus { border-color:var(--gold); }
  .scramble-btn {
    padding:12px 32px;border-radius:16px;border:none;
    background:linear-gradient(135deg,#f59e0b,#d97706);
    color:white;font-family:'Fredoka One',cursive;font-size:20px;
    cursor:pointer;transition:all 0.2s;
  }
  .scramble-btn:hover { transform:scale(1.05); }
  .scramble-feedback { font-family:'Fredoka One',cursive;font-size:22px;text-align:center;min-height:36px; }

</style>
</head>
<body>

  </div>

<script>
// ===================== STATE =====================
let coins = 0, gems = 0;
let currentMode = 2;
let currentGame = null;
let gameState = {};

function updateCurrency() {
  document.getElementById('coins-display').textContent = coins;
  document.getElementById('gems-display').textContent = gems;
}

function addReward(c, g) {
  coins += c; gems += g;
  updateCurrency();
}

// ===================== SCREENS =====================
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + id).classList.add('active');
}

function selectMode(m) {
  currentMode = m;
  document.getElementById('mode-ind').textContent = m === 2 ? '👥 2 لاعبين' : '🤖 1 لاعب';
  document.getElementById('mode-ind').className = 'mode-indicator ' + (m === 2 ? 'two' : 'one');
  buildGamesGrid();
  showScreen('games');
}

function goBack(to) {
  closeWin();
  if (to === 'mode') showScreen('mode');
  if (to === 'games') { showScreen('games'); stopGame(); }
}

// ===================== GAMES LIST =====================
const GAMES = [
  { id:'ttt', name:'XO', emoji:'❌⭕', desc:'إكس أو كلاسيكي', color:'red' },
  { id:'rps', name:'حجر ورقة مقص', emoji:'✊✋✌️', desc:'من يكسب الجولات؟', color:'blue' },
  { id:'memory', name:'الذاكرة', emoji:'🃏', desc:'اكتشف الأزواج!', color:'red' },
  { id:'snl', name:'سلم ونزّل', emoji:'🎲', desc:'ارمي الزهر تقدّم!', color:'blue' },
  { id:'guess', name:'خمّن الرقم', emoji:'🔢', desc:'من يخمّن أسرع?', color:'red' },
  { id:'spin', name:'العجلة', emoji:'🎡', desc:'أدِر العجلة واربح!', color:'blue' },
  { id:'reaction', name:'سرعة الرد', emoji:'⚡', desc:'اضغط حين يخضر!', color:'red' },
  { id:'colormatch', name:'طابق اللون', emoji:'🎨', desc:'طابق اللون الصح!', color:'blue' },
  { id:'scramble', name:'الكلمة المشفّرة', emoji:'🔤', desc:'رتّب الحروف!', color:'red' },
  { id:'balloon', name:'فقّع البالون', emoji:'🎈', desc:'من يفقع أكثر؟', color:'blue' },
];

function buildGamesGrid() {
  const grid = document.getElementById('games-grid');
  grid.innerHTML = GAMES.map(g => `
    <div class="game-card ${g.color}" onclick="startGame('${g.id}')">
      <div class="g-emoji">${g.emoji}</div>
      <div class="g-name">${g.name}</div>
      <div class="g-desc">${g.desc}</div>
    </div>
  `).join('');
}

// ===================== START GAME =====================
function startGame(id) {
  currentGame = id;
  stopGame();
  const g = GAMES.find(x => x.id === id);
  document.getElementById('game-title-bar').textContent = g.emoji + ' ' + g.name;
  document.getElementById('game-mode-ind').textContent = currentMode === 2 ? '👥 2 لاعبين' : '🤖 1 لاعب';
  document.getElementById('game-mode-ind').className = 'mode-indicator ' + (currentMode === 2 ? 'two' : 'one');

  const p2label = document.getElementById('p2-label');
  p2label.className = currentMode === 2 ? 'player-label p2' : 'player-label ai';
  p2label.textContent = currentMode === 2 ? 'لاعب 2 🔵' : '🤖 الذكاء الاصطناعي';

  showScreen('game');
  const fn = window['init_' + id];
  if (fn) fn();
}

function stopGame() {
  if (gameState.interval) clearInterval(gameState.interval);
  if (gameState.timeout) clearTimeout(gameState.timeout);
  if (gameState.balloonInterval) clearInterval(gameState.balloonInterval);
  gameState = {};
}

function setTurn(t) {
  const ind = document.getElementById('turn-ind');
  if (t === 1) ind.textContent = '🔴 دور لاعب 1';
  else if (t === 2) ind.textContent = currentMode === 2 ? '🔵 دور لاعب 2' : '🤖 دور الذكاء الاصطناعي';
  else ind.textContent = t;
}

// ===================== WIN =====================
function showWin(winner, sub) {
  const names = { 1:'🔴 لاعب 1', 2: currentMode===2?'🔵 لاعب 2':'🤖 الذكاء الاصطناعي', 0:'🤝 تعادل' };
  const emojis = { 1:'🏆', 2:'🏆', 0:'🤝' };
  document.getElementById('win-emoji').textContent = emojis[winner];
  document.getElementById('win-text').textContent = winner === 0 ? 'تعادل!' : names[winner] + ' فاز!';
  document.getElementById('win-sub').textContent = sub || 'مبروك!';
  document.getElementById('win-overlay').classList.add('show');
  if (winner !== 0) addReward(10, winner===1?0:0);
  addReward(5, 0);
}

function closeWin() {
  document.getElementById('win-overlay').classList.remove('show');
}

function playAgain() {
  closeWin();
  startGame(currentGame);
}

// ===================== GAME 1: TIC TAC TOE =====================
function init_ttt() {
  const board = Array(9).fill('');
  let turn = 1;
  gameState = { board, turn };
  setTurn(1);

  function render() {
    document.getElementById('game-container').innerHTML = `
      <div class="ttt-board" id="ttt-board">
        ${board.map((c,i) => `<div class="ttt-cell ${c?'taken':''} ${c==='X'?'x':c==='O'?'o':''}" onclick="tttClick(${i})">${c}</div>`).join('')}
      </div>
    `;
  }

  window.tttClick = function(i) {
    if (board[i] || gameState.over) return;
    if (currentMode === 1 && gameState.turn === 2) return;
    board[i] = gameState.turn === 1 ? 'X' : 'O';
    const w = checkTTT(board);
    render();
    if (w !== null) { endTTT(w, board); return; }
    gameState.turn = gameState.turn === 1 ? 2 : 1;
    setTurn(gameState.turn);
    if (currentMode === 1 && gameState.turn === 2) setTimeout(aiTTT, 500);
  };

  function aiTTT() {
    if (gameState.over) return;
    const empty = board.map((v,i) => v===''?i:-1).filter(x=>x>=0);
    if (!empty.length) return;
    // medium AI: try to win or block
    let move = -1;
    for (let m of empty) { board[m]='O'; if(checkTTT(board)===2){move=m;board[m]='';break;} board[m]=''; }
    if (move===-1) for (let m of empty) { board[m]='X'; if(checkTTT(board)===1){move=m;board[m]='';break;} board[m]=''; }
    if (move===-1) move = empty[Math.floor(Math.random()*empty.length)];
    board[move] = 'O';
    const w = checkTTT(board);
    render();
    if (w !== null) { endTTT(w, board); return; }
    gameState.turn = 1;
    setTurn(1);
  }

  function endTTT(w, board) {
    gameState.over = true;
    if (w > 0) {
      const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
      const sym = w===1?'X':'O';
      for (let l of lines) if(l.every(i=>board[i]===sym)) l.forEach(i=>document.querySelectorAll('.ttt-cell')[i].classList.add('win-cell'));
    }
    setTimeout(()=>showWin(w, w===0?'لا أحد فاز!':''), 500);
  }

  render();
}

function checkTTT(b) {
  const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  for (let [a,bb,c] of lines) {
    if (b[a]&&b[a]===b[bb]&&b[a]===b[c]) return b[a]==='X'?1:2;
  }
  if (b.every(x=>x)) return 0;
  return null;
}

// ===================== GAME 2: ROCK PAPER SCISSORS =====================
function init_rps() {
  gameState = { scores:[0,0], round:0, maxRounds:5, waiting:1 };
  setTurn(1);
  renderRPS();
}

function renderRPS(lastP1='', lastP2='', msg='') {
  const s = gameState;
  document.getElementById('game-container').innerHTML = `
    <div class="rps-scores">
      <div class="rps-score"><div class="num" style="color:var(--red)">${s.scores[0]}</div><div class="lbl">لاعب 1</div></div>
      <div class="rps-score"><div class="num" style="color:#aaa">الجولة ${s.round}/${s.maxRounds}</div><div class="lbl"></div></div>
      <div class="rps-score"><div class="num" style="color:var(--blue)">${s.scores[1]}</div><div class="lbl">${currentMode===2?'لاعب 2':'AI'}</div></div>
    </div>
    <div class="rps-display">
      <span>${lastP1||'❓'}</span>
      <span class="rps-vs">VS</span>
      <span>${lastP2||'❓'}</span>
    </div>
    <div class="rps-result">${msg}</div>
    ${s.waiting===1 ? `
      <div style="text-align:center;font-family:'Fredoka One',cursive;font-size:18px;margin-bottom:8px">🔴 لاعب 1 اختر:</div>
      <div class="rps-choices">
        <button class="rps-btn" onclick="rpsChoose('✊')">✊</button>
        <button class="rps-btn" onclick="rpsChoose('✋')">✋</button>
        <button class="rps-btn" onclick="rpsChoose('✌️')">✌️</button>
      </div>` : s.waiting===2 ? `
      <div style="text-align:center;font-family:'Fredoka One',cursive;font-size:18px;margin-bottom:8px">🔵 لاعب 2 اختر:</div>
      <div class="rps-choices">
        <button class="rps-btn" onclick="rpsChoose2('✊')">✊</button>
        <button class="rps-btn" onclick="rpsChoose2('✋')">✋</button>
        <button class="rps-btn" onclick="rpsChoose2('✌️')">✌️</button>
      </div>` : ''}
  `;
}

window.rpsChoose = function(c) {
  gameState.p1choice = c;
  if (currentMode === 1) {
    const ai = ['✊','✋','✌️'][Math.floor(Math.random()*3)];
    rpsResolve(c, ai);
  } else {
    gameState.waiting = 2;
    renderRPS('✅','❓','لاعب 2 اختر الآن!');
  }
};

window.rpsChoose2 = function(c) {
  rpsResolve(gameState.p1choice, c);
};

function rpsResolve(p1, p2) {
  const beats = {'✊':'✌️','✋':'✊','✌️':'✋'};
  let result, winner = 0;
  if (p1===p2) { result='🤝 تعادل!'; }
  else if (beats[p1]===p2) { result='🔴 لاعب 1 يفوز!'; gameState.scores[0]++; winner=1; }
  else { result= currentMode===2?'🔵 لاعب 2 يفوز!':'🤖 AI يفوز!'; gameState.scores[1]++; winner=2; }
  gameState.round++;
  gameState.waiting = 1;
  renderRPS(p1, p2, result);
  if (gameState.round >= gameState.maxRounds) {
    setTimeout(()=>{
      const [s1,s2]=gameState.scores;
      showWin(s1>s2?1:s2>s1?2:0, `النتيجة ${s1} - ${s2}`);
    }, 1000);
  } else {
    setTurn(1);
  }
}

// ===================== GAME 3: MEMORY =====================
function init_memory() {
  const emojis = ['🐶','🐱','🐭','🐹','🐰','🦊','🐻','🐼'];
  const cards = [...emojis,...emojis].sort(()=>Math.random()-0.5).map((e,i)=>({id:i,emoji:e,flipped:false,matched:false}));
  gameState = { cards, turn:1, scores:[0,0], flipped:[], locked:false };
  setTurn(1);
  renderMemory();
  if (currentMode===1 && gameState.turn===2) setTimeout(aiMemory,800);
}

function renderMemory() {
  const {cards} = gameState;
  document.getElementById('game-container').innerHTML = `
    <div class="mem-scores">
      <div class="mem-score"><div class="num" style="color:var(--red)">${gameState.scores[0]}</div><div class="lbl">لاعب 1</div></div>
      <div class="mem-score"><div class="num" style="color:var(--blue)">${gameState.scores[1]}</div><div class="lbl">${currentMode===2?'لاعب 2':'AI'}</div></div>
    </div>
    <div class="mem-board" style="grid-template-columns:repeat(4,1fr);max-width:340px">
      ${cards.map((c,i)=>`
        <div class="mem-card ${c.flipped||c.matched?'flipped':''} ${c.matched?'matched':''}" onclick="memClick(${i})">
          ${c.flipped||c.matched?c.emoji:''}
        </div>`).join('')}
    </div>
  `;
}

window.memClick = function(i) {
  const s = gameState;
  if (s.locked||s.cards[i].flipped||s.cards[i].matched) return;
  if (currentMode===1&&s.turn===2) return;
  s.cards[i].flipped = true;
  s.flipped.push(i);
  renderMemory();
  if (s.flipped.length===2) {
    s.locked = true;
    setTimeout(()=>memCheck(), 700);
  }
};

function memCheck() {
  const s = gameState;
  const [a,b] = s.flipped;
  if (s.cards[a].emoji === s.cards[b].emoji) {
    s.cards[a].matched = s.cards[b].matched = true;
    s.scores[s.turn-1]++;
  } else {
    s.cards[a].flipped = s.cards[b].flipped = false;
    s.turn = s.turn===1?2:1;
    setTurn(s.turn);
  }
  s.flipped = [];
  s.locked = false;
  renderMemory();
  if (s.cards.every(c=>c.matched)) {
    setTimeout(()=>showWin(s.scores[0]>s.scores[1]?1:s.scores[1]>s.scores[0]?2:0,`${s.scores[0]} - ${s.scores[1]}`),500);
    return;
  }
  if (currentMode===1&&s.turn===2) setTimeout(aiMemory,600);
}

function aiMemory() {
  const s = gameState;
  if (s.locked||!s.cards.some(c=>!c.matched)) return;
  const avail = s.cards.map((c,i)=>c.matched||c.flipped?-1:i).filter(x=>x>=0);
  if (avail.length<2) return;
  // simple random AI
  const [a,b] = avail.sort(()=>Math.random()-0.5).slice(0,2);
  s.cards[a].flipped = true; s.flipped.push(a); renderMemory();
  setTimeout(()=>{ s.cards[b].flipped=true; s.flipped.push(b); renderMemory(); s.locked=true; setTimeout(memCheck,700); },600);
}

// ===================== GAME 4: SNAKE & LADDER (Dice Race) =====================
function init_snl() {
  gameState = { pos:[0,0], turn:1, over:false };
  setTurn(1);
  const specials = {5:'🐍-3',14:'🪜+4',18:'🐍-5',25:'🪜+5',35:'🐍-8',42:'🪜+6',48:'🐍-4',55:'🪜+7',62:'🐍-9',68:'🪜+5',74:'🐍-6',80:'🪜+8',87:'🐍-10',92:'🪜+6',97:'🐍-5'};
  gameState.specials = specials;
  renderSNL();
}

function renderSNL() {
  const s = gameState;
  const cells = [];
  for(let i=100;i>=1;i--) {
    const sp = s.specials[i]||'';
    cells.push(`<div class="snl-cell ${sp?'special':''}">
      ${sp?sp.charAt(0):''}
      <span style="font-size:9px;opacity:0.5">${i}</span>
      ${s.pos[0]===i?'<div class="pawn p1"></div>':''}
      ${s.pos[1]===i?'<div class="pawn p2"></div>':''}
    </div>`);
  }
  document.getElementById('game-container').innerHTML = `
    <div class="snl-board">${cells.join('')}</div>
    <div class="snl-info" id="snl-info">🔴 لاعب 1 في موقع ${s.pos[0]} | 🔵 ${currentMode===2?'لاعب 2':'AI'} في موقع ${s.pos[1]}</div>
    <button class="snl-dice-btn" id="snl-dice" onclick="snlRoll()" ${s.over?'disabled':''}>🎲 ارمِ الزهر</button>
  `;
}

window.snlRoll = function() {
  const s = gameState;
  if (s.over) return;
  const dice = Math.ceil(Math.random()*6);
  const t = s.turn-1;
  let pos = s.pos[t] + dice;
  let info = `${s.turn===1?'🔴':'🔵'} رمى ${dice}`;
  if (pos >= 100) { s.pos[t]=100; s.over=true; renderSNL(); showWin(s.turn,`🎲 وصل للنهاية!`); return; }
  const sp = s.specials[pos];
  if (sp) {
    const delta = parseInt(sp.slice(1));
    pos = Math.max(1, pos+delta);
    info += sp.charAt(0)==='🐍'?' 🐍 تنازل!'>' 🪜 تقدّم!';
  }
  s.pos[t] = pos;
  s.turn = s.turn===1?2:1;
  setTurn(s.turn);
  document.getElementById('snl-info').textContent = info;
  renderSNL();
  if (currentMode===1&&s.turn===2) setTimeout(snlRoll,800);
};

// ===================== GAME 5: GUESS NUMBER =====================
function init_guess() {
  const target = Math.floor(Math.random()*100)+1;
  gameState = { target, turn:1, scores:[0,0], round:1, maxRounds:3, hints:[], guesses:0, phase:'playing' };
  setTurn(1);
  renderGuess();
}

function renderGuess() {
  const s = gameState;
  document.getElementById('game-container').innerHTML = `
    <div class="guess-scores">
      <div class="guess-score"><div class="num" style="color:var(--red)">${s.scores[0]}</div><div class="lbl">لاعب 1</div></div>
      <div class="guess-score"><div class="num">جولة ${s.round}/${s.maxRounds}</div><div class="lbl"></div></div>
      <div class="guess-score"><div class="num" style="color:var(--blue)">${s.scores[1]}</div><div class="lbl">${currentMode===2?'لاعب 2':'AI'}</div></div>
    </div>
    <p style="font-family:'Fredoka One',cursive;font-size:20px">خمّن رقم من 1 إلى 100</p>
    <div style="display:flex;gap:10px;align-items:center">
      <input class="guess-input" id="guess-inp" type="number" min="1" max="100" placeholder="؟" onkeydown="if(event.key==='Enter')guessSubmit()">
      <button class="guess-btn" onclick="guessSubmit()">تخمين!</button>
    </div>
    <div class="guess-hints">${s.hints.map(h=>`<div class="guess-hint">${h}</div>`).join('')}</div>
  `;
  const inp = document.getElementById('guess-inp');
  if (inp) inp.focus();
}

window.guessSubmit = function() {
  const s = gameState;
  const val = parseInt(document.getElementById('guess-inp').value);
  if (!val||val<1||val>100) return;
  s.guesses++;
  if (val===s.target) {
    s.scores[s.turn-1]++;
    s.hints.push(`✅ صح! الرقم كان ${s.target} (${s.guesses} محاولات)`);
    renderGuess();
    if (s.round >= s.maxRounds) {
      setTimeout(()=>showWin(s.scores[0]>s.scores[1]?1:s.scores[1]>s.scores[0]?2:0),800);
    } else {
      s.round++; s.turn=s.turn===1?2:1; s.target=Math.floor(Math.random()*100)+1; s.hints=[]; s.guesses=0;
      setTurn(s.turn);
      setTimeout(renderGuess,800);
      if(currentMode===1&&s.turn===2) setTimeout(aiGuess,1000);
    }
  } else {
    s.hints.unshift(val < s.target ? `⬆️ ${val} أصغر من الرقم` : `⬇️ ${val} أكبر من الرقم`);
    if (s.hints.length > 3) s.hints.pop();
    renderGuess();
    if (currentMode===2) { s.turn=s.turn===1?2:1; setTurn(s.turn); }
    else if(currentMode===1) setTimeout(aiGuess,800);
  }
};

let aiGuessLow=1,aiGuessHigh=100;
function aiGuess() {
  const s = gameState;
  if(s.turn!==2) return;
  const guess = Math.floor((aiGuessLow+aiGuessHigh)/2);
  if(guess===s.target){
    s.scores[1]++;
    s.hints.push(`🤖 AI خمّن ${guess} ✅`);
    renderGuess();
    aiGuessLow=1;aiGuessHigh=100;
    if(s.round>=s.maxRounds){setTimeout(()=>showWin(s.scores[0]>s.scores[1]?1:s.scores[1]>s.scores[0]?2:0),800);return;}
    s.round++;s.turn=1;s.target=Math.floor(Math.random()*100)+1;s.hints=[];s.guesses=0;
    setTurn(1);setTimeout(renderGuess,800);
  } else {
    if(guess<s.target) aiGuessLow=guess+1; else aiGuessHigh=guess-1;
    s.hints.unshift(`🤖 AI جرّب ${guess} ${guess<s.target?'⬆️':'⬇️'}`);
    if(s.hints.length>3)s.hints.pop();
    renderGuess();
    setTimeout(aiGuess,800);
  }
}

// ===================== GAME 6: SPIN WHEEL =====================
function init_spin() {
  gameState = { scores:[0,0], turn:1, spinning:false, round:0, maxRounds:6 };
  setTurn(1);
  renderSpin();
}

function renderSpin() {
  const s = gameState;
  document.getElementById('game-container').innerHTML = `
    <div class="spin-scores">
      <div class="spin-score"><div class="num" style="color:var(--red)">${s.scores[0]}</div><div class="lbl">لاعب 1</div></div>
      <div class="spin-score"><div class="num">جولة ${s.round}/${s.maxRounds}</div><div class="lbl"></div></div>
      <div class="spin-score"><div class="num" style="color:var(--blue)">${s.scores[1]}</div><div class="lbl">${currentMode===2?'لاعب 2':'AI'}</div></div>
    </div>
    <div class="wheel-wrap">
      <span class="wheel-arrow">▼</span>
      <canvas id="wheel" width="260" height="260"></canvas>
    </div>
    <div class="spin-result" id="spin-result">أدِر العجلة!</div>
    <button class="spin-btn" id="spin-btn" onclick="doSpin()" ${s.spinning?'disabled':''}>🌀 أدِر!</button>
  `;
  drawWheel(0);
}

const SECTORS = [
  {label:'💎 +3',pts:3,color:'#9333ea'},{label:'🪙 +2',pts:2,color:'#f59e0b'},
  {label:'⭐ +1',pts:1,color:'#22c55e'},{label:'💀 -1',pts:-1,color:'#ef4444'},
  {label:'🪙 +2',pts:2,color:'#f59e0b'},{label:'⭐ +1',pts:1,color:'#3b82f6'},
  {label:'🎁 +4',pts:4,color:'#ec4899'},{label:'💀 -2',pts:-2,color:'#dc2626'},
];

function drawWheel(rot) {
  const cv = document.getElementById('wheel');
  if (!cv) return;
  const ctx = cv.getContext('2d');
  const n = SECTORS.length, arc = (2*Math.PI)/n, r=125;
  ctx.clearRect(0,0,260,260);
  SECTORS.forEach((s,i)=>{
    const a = rot + i*arc;
    ctx.beginPath();ctx.moveTo(130,130);
    ctx.arc(130,130,r,a,a+arc);ctx.closePath();
    ctx.fillStyle=s.color;ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=2;ctx.stroke();
    ctx.save();ctx.translate(130,130);ctx.rotate(a+arc/2);
    ctx.textAlign='right';ctx.fillStyle='white';ctx.font='bold 14px Tajawal';
    ctx.fillText(s.label,r-8,5);ctx.restore();
  });
  ctx.beginPath();ctx.arc(130,130,18,0,2*Math.PI);ctx.fillStyle='#1a0533';ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=3;ctx.stroke();
}

window.doSpin = function() {
  if (gameState.spinning) return;
  gameState.spinning = true;
  document.getElementById('spin-btn').disabled = true;
  const totalRot = (5+Math.random()*5)*2*Math.PI;
  const dur = 3000, start = performance.now();
  let current = gameState.lastRot||0;
  function frame(now) {
    const t = Math.min((now-start)/dur, 1);
    const ease = 1-Math.pow(1-t,4);
    const rot = current + totalRot*ease;
    drawWheel(rot % (2*Math.PI));
    if (t<1) { requestAnimationFrame(frame); return; }
    gameState.lastRot = rot % (2*Math.PI);
    const arc = (2*Math.PI)/SECTORS.length;
    const idx = SECTORS.length - 1 - Math.floor(((gameState.lastRot % (2*Math.PI)) / arc)) % SECTORS.length;
    const sector = SECTORS[(idx+SECTORS.length)%SECTORS.length];
    gameState.scores[gameState.turn-1] = Math.max(0, gameState.scores[gameState.turn-1] + sector.pts);
    gameState.round++;
    document.getElementById('spin-result').textContent = `${sector.label} (${sector.pts>0?'+':''}${sector.pts} نقاط)`;
    gameState.spinning = false;
    if (gameState.round >= gameState.maxRounds) {
      setTimeout(()=>showWin(gameState.scores[0]>gameState.scores[1]?1:gameState.scores[1]>gameState.scores[0]?2:0),800);
    } else {
      gameState.turn = gameState.turn===1?2:1;
      setTurn(gameState.turn);
      setTimeout(()=>{
        renderSpin();
        if(currentMode===1&&gameState.turn===2) setTimeout(doSpin,800);
      },1000);
    }
  }
  requestAnimationFrame(frame);
};

// ===================== GAME 7: REACTION =====================
function init_reaction() {
  gameState = { scores:[0,0], round:0, maxRounds:5, phase:'waiting', turn:1 };
  setTurn(1);
  renderReaction('انتظر الإشارة الخضراء!');
  setTimeout(reactionWait, 1000);
}

function renderReaction(msg) {
  const s = gameState;
  document.getElementById('game-container').innerHTML = `
    <div class="reaction-scores">
      <div class="reaction-score"><div class="num" style="color:var(--red)">${s.scores[0]}</div><div class="lbl">لاعب 1</div></div>
      <div class="reaction-score"><div class="num">جولة ${s.round}/${s.maxRounds}</div><div class="lbl"></div></div>
      <div class="reaction-score"><div class="num" style="color:var(--blue)">${s.scores[1]}</div><div class="lbl">${currentMode===2?'لاعب 2':'AI'}</div></div>
    </div>
    <div class="reaction-area ${s.phase==='go'?'ready':s.phase==='early'?'too-early':'waiting'}" id="react-area" onclick="reactionTap()">
      ${s.phase==='go'?'🟢 اضغط الآن!':s.phase==='early'?'❌ بكير!':'⏳ انتظر...'}
    </div>
    <div class="reaction-info" id="react-info">${msg}</div>
    <button class="next-round-btn" id="next-round-btn" onclick="reactionNext()" style="display:${s.phase==='done'?'block':'none'}">التالي ⏩</button>
  `;
}

function reactionWait() {
  const delay = 1500+Math.random()*3000;
  gameState.timeout = setTimeout(()=>{
    gameState.phase='go'; gameState.startTime=Date.now(); renderReaction('اضغط!');
    if(currentMode===1&&gameState.turn===2) setTimeout(()=>{if(gameState.phase==='go'){gameState.phase='done';const rt=Math.floor(150+Math.random()*200);gameState.scores[1]++;gameState.round++;renderReaction(`🤖 AI ${rt}ms!`);document.getElementById('next-round-btn').style.display='block';}},150+Math.random()*200);
  }, delay);
}

window.reactionTap = function() {
  const s = gameState;
  if(s.phase==='waiting'){s.phase='early';clearTimeout(s.timeout);renderReaction('بكير! خسرت الجولة');s.round++;setTimeout(()=>{if(s.round>=s.maxRounds){showWin(s.scores[0]>s.scores[1]?1:s.scores[1]>s.scores[0]?2:0);}else{s.phase='waiting';s.turn=s.turn===1?2:1;setTurn(s.turn);renderReaction('...');setTimeout(reactionWait,1000);}},1200);return;}
  if(s.phase!=='go') return;
  const rt = Date.now()-s.startTime;
  s.scores[s.turn-1]++;
  s.phase='done'; s.round++;
  renderReaction(`⚡ ${rt}ms!`);
  document.getElementById('next-round-btn').style.display='block';
};

window.reactionNext = function() {
  const s = gameState;
  if(s.round>=s.maxRounds){showWin(s.scores[0]>s.scores[1]?1:s.scores[1]>s.scores[0]?2:0);return;}
  s.phase='waiting'; s.turn=s.turn===1?2:1; setTurn(s.turn);
  renderReaction('...');
  setTimeout(reactionWait,1000);
};

// ===================== GAME 8: COLOR MATCH =====================
const COLORS_DATA = [
  {name:'أحمر',hex:'#ef4444'},{name:'أزرق',hex:'#3b82f6'},{name:'أخضر',hex:'#22c55e'},
  {name:'أصفر',hex:'#fbbf24'},{name:'بنفسجي',hex:'#a855f7'},{name:'برتقالي',hex:'#f97316'},
  {name:'وردي',hex:'#ec4899'},{name:'سماوي',hex:'#06b6d4'},
];

function init_colormatch() {
  gameState = { scores:[0,0], turn:1, round:0, maxRounds:8 };
  setTurn(1);
  nextColorRound();
}

function nextColorRound() {
  const s = gameState;
  const correct = COLORS_DATA[Math.floor(Math.random()*COLORS_DATA.length)];
  const wrong = COLORS_DATA.filter(c=>c!==correct).sort(()=>Math.random()-0.5).slice(0,3);
  const choices = [...wrong, correct].sort(()=>Math.random()-0.5);
  const mismatch = Math.random()>0.5;
  const displayColor = mismatch ? COLORS_DATA.filter(c=>c.name!==correct.name)[Math.floor(Math.random()*7)] : correct;
  gameState.correct = correct; gameState.choices = choices;
  document.getElementById('game-container').innerHTML = `
    <div class="color-scores">
      <div class="color-score"><div class="num" style="color:var(--red)">${s.scores[0]}</div><div class="lbl">لاعب 1</div></div>
      <div class="color-score"><div class="num">جولة ${s.round+1}/${s.maxRounds}</div><div class="lbl"></div></div>
      <div class="color-score"><div class="num" style="color:var(--blue)">${s.scores[1]}</div><div class="lbl">${currentMode===2?'لاعب 2':'AI'}</div></div>
    </div>
    <div class="color-question">ما هذا اللون؟</div>
    <div class="color-display" style="background:${displayColor.hex}">${correct.name}</div>
    <div class="color-choices">
      ${choices.map(c=>`<div class="color-choice" style="background:${c.hex}" onclick="colorPick('${c.name}')"></div>`).join('')}
    </div>
    <div class="color-feedback" id="color-fb"></div>
  `;
  if(currentMode===1&&s.turn===2) setTimeout(()=>colorPick(correct.name),700+Math.random()*600);
}

window.colorPick = function(name) {
  const s = gameState;
  const correct = s.correct.name===name;
  document.getElementById('color-fb').textContent = correct ? '✅ صح!' : `❌ غلط! كان ${s.correct.name}`;
  if(correct) s.scores[s.turn-1]++;
  s.round++; s.turn=s.turn===1?2:1; setTurn(s.turn);
  if(s.round>=s.maxRounds){setTimeout(()=>showWin(s.scores[0]>s.scores[1]?1:s.scores[1]>s.scores[0]?2:0),800);return;}
  setTimeout(nextColorRound,900);
};

// ===================== GAME 9: WORD SCRAMBLE =====================
const WORDS = [
  {word:'قطة',hint:'حيوان يموء'},{word:'كلب',hint:'حيوان وفي'},{word:'سمك',hint:'يعيش في الماء'},
  {word:'بيت',hint:'نسكن فيه'},{word:'ماء',hint:'نشربه'},{word:'نجم',hint:'يضيء الليل'},
  {word:'قمر',hint:'في السماء ليلاً'},{word:'شمس',hint:'تشرق نهاراً'},{word:'كتاب',hint:'نقرأ منه'},
  {word:'قلم',hint:'نكتب به'},{word:'باب',hint:'ندخل منه'},{word:'نافذة',hint:'ننظر منها'},
];

function init_scramble() {
  gameState = { scores:[0,0], turn:1, round:0, maxRounds:6, timeLeft:15 };
  setTurn(1);
  nextScramble();
}

function scrambleWord(w) {
  const arr = w.split('');
  for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}
  return arr.join('');
}

function nextScramble() {
  const s = gameState;
  clearInterval(s.interval);
  const wdata = WORDS[Math.floor(Math.random()*WORDS.length)];
  let sc = scrambleWord(wdata.word);
  while(sc===wdata.word) sc=scrambleWord(wdata.word);
  gameState.wordData = wdata; gameState.scrambled = sc; gameState.timeLeft=15;
  renderScramble('');
  gameState.interval = setInterval(()=>{
    gameState.timeLeft--;
    const el = document.getElementById('sc-timer');
    if(el) el.textContent = '⏱️ ' + gameState.timeLeft;
    if(gameState.timeLeft<=0){
      clearInterval(gameState.interval);
      gameState.scores[gameState.turn-1===0?1:0];
      gameState.round++;gameState.turn=gameState.turn===1?2:1;setTurn(gameState.turn);
      renderScramble(`⌛ وقت انتهى! الكلمة كانت: ${wdata.word}`);
      if(gameState.round>=gameState.maxRounds){setTimeout(()=>showWin(gameState.scores[0]>gameState.scores[1]?1:gameState.scores[1]>gameState.scores[0]?2:0),1000);return;}
      setTimeout(nextScramble,1200);
      if(currentMode===1&&gameState.turn===2) setTimeout(()=>scrambleSubmit(wdata.word),500);
    }
  },1000);
  if(currentMode===1&&s.turn===2) setTimeout(()=>{if(gameState.wordData===wdata)scrambleSubmit(wdata.word);},1500+Math.random()*2000);
}

function renderScramble(fb) {
  const s = gameState;
  document.getElementById('game-container').innerHTML = `
    <div class="scramble-scores">
      <div class="scramble-score"><div class="num" style="color:var(--red)">${s.scores[0]}</div><div class="lbl">لاعب 1</div></div>
      <div class="scramble-score"><div class="num">جولة ${s.round+1}/${s.maxRounds}</div><div class="lbl"></div></div>
      <div class="scramble-score"><div class="num" style="color:var(--blue)">${s.scores[1]}</div><div class="lbl">${currentMode===2?'لاعب 2':'AI'}</div></div>
    </div>
    <div class="scramble-timer" id="sc-timer">⏱️ ${s.timeLeft}</div>
    <div class="scramble-word">${s.scrambled}</div>
    <div class="scramble-hint">تلميح: ${s.wordData.hint}</div>
    <div style="display:flex;gap:10px;align-items:center">
      <input class="scramble-input" id="sc-inp" placeholder="اكتب الكلمة" onkeydown="if(event.key==='Enter')scrambleSubmit(document.getElementById('sc-inp').value)">
      <button class="scramble-btn" onclick="scrambleSubmit(document.getElementById('sc-inp').value)">تأكيد!</button>
    </div>
    <div class="scramble-feedback">${fb}</div>
  `;
}

window.scrambleSubmit = function(val) {
  const s = gameState;
  if(!val) val = (document.getElementById('sc-inp')||{}).value||'';
  if(val.trim()===s.wordData.word){
    clearInterval(s.interval);
    s.scores[s.turn-1]++;
    s.round++;s.turn=s.turn===1?2:1;setTurn(s.turn);
    renderScramble('✅ صح!');
    if(s.round>=s.maxRounds){setTimeout(()=>showWin(s.scores[0]>s.scores[1]?1:s.scores[1]>s.scores[0]?2:0),800);return;}
    setTimeout(nextScramble,900);
  } else {
    renderScramble('❌ غلط، حاول مرة ثانية');
  }
};

// ===================== GAME 10: BALLOON POP =====================
function init_balloon() {
  gameState = { scores:[0,0], timeLeft:30, over:false, balloonInterval:null };
  renderBalloon();
  gameState.interval = setInterval(()=>{
    gameState.timeLeft--;
    const el=document.getElementById('balloon-timer');
    if(el) el.textContent='⏱️ '+gameState.timeLeft+'s';
    if(gameState.timeLeft<=0){
      clearInterval(gameState.interval);clearInterval(gameState.balloonInterval);
      gameState.over=true;
      showWin(gameState.scores[0]>gameState.scores[1]?1:gameState.scores[1]>gameState.scores[0]?2:0,`${gameState.scores[0]} - ${gameState.scores[1]}`);
    }
  },1000);
  gameState.balloonInterval = setInterval(spawnBalloon, 800);
  if(currentMode===1) gameState.aiInterval=setInterval(aiPopBalloon,1200);
}

const BALLOON_COLORS = ['#ef4444','#3b82f6','#22c55e','#f59e0b','#a855f7','#ec4899'];

function renderBalloon() {
  const s = gameState;
  document.getElementById('game-container').innerHTML = `
    <div class="balloon-scores">
      <div class="balloon-score"><div class="num" style="color:var(--red)" id="bs1">${s.scores[0]}</div><div class="lbl">🔴 لاعب 1 (اليسار)</div></div>
      <div class="balloon-score"><div class="num" style="color:var(--blue)" id="bs2">${s.scores[1]}</div><div class="lbl">${currentMode===2?'🔵 لاعب 2 (اليمين)':'🤖 AI'}</div></div>
    </div>
    <div class="balloon-timer" id="balloon-timer">⏱️ ${s.timeLeft}s</div>
    <div class="balloon-field" id="balloon-field"></div>
    <p style="font-size:13px;opacity:0.6;text-align:center">${currentMode===2?'لاعب 1: نصف الشاشة اليسار | لاعب 2: نصف اليمين':'اضغط على البالونات!'}</p>
  `;
}

let balloonId = 0;
function spawnBalloon() {
  const field = document.getElementById('balloon-field');
  if (!field || gameState.over) return;
  const id = ++balloonId;
  const left = Math.random()*85;
  const color = BALLOON_COLORS[Math.floor(Math.random()*BALLOON_COLORS.length)];
  const div = document.createElement('div');
  div.className='balloon'; div.id='b'+id;
  div.style.left=left+'%'; div.style.background=color;
  div.textContent='🎈';
  div.onclick=function(e){
    e.stopPropagation();
    const rect=field.getBoundingClientRect();
    const clickX=e.clientX-rect.left;
    const fieldW=rect.width;
    let player;
    if(currentMode===2) player = clickX<fieldW/2 ? 1 : 2;
    else player=1;
    gameState.scores[player-1]++;
    const s1=document.getElementById('bs1'),s2=document.getElementById('bs2');
    if(s1)s1.textContent=gameState.scores[0];
    if(s2)s2.textContent=gameState.scores[1];
    div.style.transform='scale(1.5)';div.style.opacity='0';
    setTimeout(()=>div.remove(),200);
  };
  div.addEventListener('animationend',()=>div.remove());
  field.appendChild(div);
}

function aiPopBalloon() {
  if(gameState.over) return;
  const field=document.getElementById('balloon-field');
  if(!field) return;
  const balloons=field.querySelectorAll('.balloon');
  if(balloons.length>0) {
    const b=balloons[Math.floor(Math.random()*balloons.length)];
    gameState.scores[1]++;
    const s2=document.getElementById('bs2');if(s2)s2.textContent=gameState.scores[1];
    b.style.transform='scale(1.5)';b.style.opacity='0';
    setTimeout(()=>b.remove(),200);
  }
}
